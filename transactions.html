<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History — EagleEyE</title>
<link rel="stylesheet" href="style.css">
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("ee_theme")||"dark");</script>
<style>
.tx-wrap{max-width:900px;margin:0 auto;padding:28px 24px 60px;}
.tx-filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.tx-search{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;width:180px;font-family:var(--font-body);}
.tx-search:focus{outline:none;border-color:var(--gold-dim);}
.filter-chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text-dim);font-size:12px;cursor:pointer;font-family:var(--font-body);transition:all .15s;}
.filter-chip.active{background:var(--gold-glow);border-color:var(--gold-dim);color:var(--gold-bright);}
.tx-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.tx-table th{padding:11px 16px;text-align:left;font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;background:var(--panel-2);font-weight:500;}
.tx-table th:not(:first-child):not(:nth-child(2)){text-align:right;}
.tx-table td{padding:13px 16px;border-top:1px solid var(--border-soft);font-size:13px;}
.tx-table td:not(:first-child):not(:nth-child(2)){text-align:right;font-family:var(--font-mono);}
.tx-table tr:hover td{background:rgba(255,255,255,0.02);}
.buy-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--green-fill);color:var(--green-bright);}
.sell-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--red-fill);color:var(--red);}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;}
.summary-card .lbl{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;}
.summary-card .val{font-size:18px;font-weight:700;font-family:var(--font-display);}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
@media(max-width:700px){
  .summary-grid{grid-template-columns:repeat(2,1fr);}
  .tx-table th:nth-child(4),.tx-table td:nth-child(4){display:none;}
}
</style>
</head>
<body>
<div id="chrome-header"></div>

<div class="tx-wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
    <div>
      <div style="font-family:var(--font-display);font-size:26px;font-weight:600;">Transaction History</div>
      <div style="font-size:13px;color:var(--text-dim);margin-top:4px;">All your GSE buys and sells</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="exportTxCSV()">⬇ Export CSV</button>
  </div>

  <!-- Summary cards -->
  <div class="summary-grid" id="tx-summary"></div>

  <!-- Filters -->
  <div class="tx-filters">
    <input type="text" class="tx-search" id="tx-search" placeholder="Search ticker…" oninput="renderTx()">
    <button class="filter-chip active" onclick="setFilter('all',this)">All</button>
    <button class="filter-chip" onclick="setFilter('buy',this)">Buys</button>
    <button class="filter-chip" onclick="setFilter('sell',this)">Sells</button>
    <span style="margin-left:auto;font-size:12px;color:var(--text-faint);" id="tx-count"></span>
  </div>

  <!-- Table -->
  <div id="tx-table-wrap"></div>
</div>

<div id="chrome-footer"></div>
<script src="auth.js"></script>
<script src="auth-guard.js"></script>
<script src="data.js"></script>
<script>
mountChrome('transactions.html');

let txFilter = 'all';
let allTx = [];

function loadTx(){
  allTx = JSON.parse(localStorage.getItem('ee_tx_history') || '[]');

  // Sort newest first
  allTx.sort((a,b) => new Date(b.date) - new Date(a.date));

  // Render summary
  const buys  = allTx.filter(t=>t.type==='buy');
  const sells = allTx.filter(t=>t.type==='sell');
  const totalBuyValue  = buys.reduce((s,t)=>s+(t.total||0),0);
  const totalSellValue = sells.reduce((s,t)=>s+(t.total||0),0);
  const realised = totalSellValue - sells.reduce((s,t)=>s+(t.shares*(t.avgCostAtSell||t.price)||0),0);

  document.getElementById('tx-summary').innerHTML = `
    <div class="summary-card"><div class="lbl">Total transactions</div><div class="val">${allTx.length}</div></div>
    <div class="summary-card"><div class="lbl">Total buys</div><div class="val" style="color:var(--green-bright);">${buys.length}</div></div>
    <div class="summary-card"><div class="lbl">Total sells</div><div class="val" style="color:var(--red);">${sells.length}</div></div>
    <div class="summary-card"><div class="lbl">Total invested</div><div class="val">GH₵${fmt(totalBuyValue,0)}</div></div>`;

  renderTx();
}

function setFilter(f, btn){
  txFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  renderTx();
}

function renderTx(){
  const q = (document.getElementById('tx-search').value||'').toLowerCase();
  let filtered = allTx;
  if(txFilter !== 'all') filtered = filtered.filter(t=>t.type===txFilter);
  if(q) filtered = filtered.filter(t=>(t.ticker||'').toLowerCase().includes(q));

  document.getElementById('tx-count').textContent = filtered.length + ' transaction' + (filtered.length!==1?'s':'');

  if(!filtered.length){
    document.getElementById('tx-table-wrap').innerHTML = `
      <div class="empty-state">
        <div style="font-size:36px;margin-bottom:14px;">📋</div>
        <div style="font-size:16px;font-weight:600;margin-bottom:8px;">${allTx.length?'No results':'No transactions yet'}</div>
        <div style="font-size:13px;">${allTx.length?'Try a different filter or search term.':'Your buys and sells will appear here automatically.'}</div>
        ${!allTx.length?'<a href="dashboard.html" class="btn btn-gold" style="margin-top:18px;display:inline-block;">Go to Portfolio →</a>':''}
      </div>`;
    return;
  }

  // Group by month
  const grouped = {};
  filtered.forEach(t=>{
    const d = new Date(t.date);
    const key = d.toLocaleDateString('en-GH',{month:'long',year:'numeric'});
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(t);
  });

  let html = '<table class="tx-table"><thead><tr><th>Date</th><th>Stock</th><th>Type</th><th>Shares</th><th>Price (GH₵)</th><th>Total (GH₵)</th></tr></thead><tbody>';

  Object.entries(grouped).forEach(([month, txs])=>{
    html += `<tr><td colspan="6" style="padding:8px 16px;background:var(--panel-2);font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;">${month}</td></tr>`;
    txs.forEach(t=>{
      const d = new Date(t.date);
      const dateStr = d.toLocaleDateString('en-GH',{day:'numeric',month:'short'});
      const timeStr = d.toLocaleTimeString('en-GH',{hour:'2-digit',minute:'2-digit'});
      const tag = t.type==='buy'
        ? '<span class="buy-tag">↑ Buy</span>'
        : '<span class="sell-tag">↓ Sell</span>';
      const total = t.total || (t.shares * t.price);
      const gl = t.type==='sell' ? (t.total - (t.shares * (t.avgCostAtSell||t.price))) : null;
      html += `<tr>
        <td>
          <div style="font-weight:500;">${dateStr}</div>
          <div style="font-size:11px;color:var(--text-faint);font-family:var(--font-mono);">${timeStr}</div>
        </td>
        <td>
          <a href="company.html?t=${t.ticker}" style="font-weight:700;color:var(--text);text-decoration:none;">${t.ticker}</a>
        </td>
        <td>${tag}</td>
        <td>${fmt(t.shares,0)}</td>
        <td>${fmt(t.price,4)}</td>
        <td>
          <div>${fmt(total,2)}</div>
          ${gl!==null?`<div style="font-size:11px;color:${gl>=0?'var(--green-bright)':'var(--red)'};">${gl>=0?'+':''}${fmt(gl,2)} P&L</div>`:''}
        </td>
      </tr>`;
    });
  });

  html += '</tbody></table>';
  document.getElementById('tx-table-wrap').innerHTML = html;
}

function exportTxCSV(){
  if(!allTx.length){ alert('No transactions to export.'); return; }
  const rows = [
    ['Date','Ticker','Type','Shares','Price (GH₵)','Total (GH₵)'],
    ...allTx.map(t=>[
      new Date(t.date).toLocaleDateString('en-GH'),
      t.ticker, t.type,
      t.shares, t.price.toFixed(4),
      (t.total||(t.shares*t.price)).toFixed(2)
    ])
  ];
  const csv = rows.map(r=>r.map(c=>'"'+String(c)+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`EagleEyE-Transactions-${new Date().toISOString().substring(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

loadTx();
</script>
</body>
</html>
